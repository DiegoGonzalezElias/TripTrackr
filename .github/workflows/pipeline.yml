name: Pipeline

on:
  push:

jobs:
  avoid_redundancy:
    runs-on: ubuntu-22.04
    name: 🔄 avoid redundancy
    steps:
      - name: Cancel previous redundant builds
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}

  lint:
    runs-on: ubuntu-22.04
    name: 💅 lint
    steps:
      - name: 👍 Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18.13.0'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  build:
    runs-on: ubuntu-22.04
    name: 🚧 build
    steps:
      - name: 👍 Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18.13.0'

      - name: Make envfile
        env:
          VITE_APP_PUBLIC_URL: ${{ secrets.VITE_APP_PUBLIC_URL }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_APP_BASE_URL: ${{ secrets.VITE_APP_BASE_URL }}
          VITE_APP_API_URL: ${{secrets.VITE_APP_API_URL}}
          VITE_APP_API_SOCKET_URL: ${{secrets.VITE_APP_API_SOCKET_URL}}
        run: |
          echo "${ENV_FILE_CONTENT}" > ./environments/.env.dev

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          CI: ''
        run: npm run build

  test:
    name: 🧪 test
    runs-on: ubuntu-22.04
    steps:
      - name: 👍 Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18.13.0'

      - name: Make envfile
        env:
          VITE_APP_PUBLIC_URL: ${{ secrets.VITE_APP_PUBLIC_URL }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_APP_BASE_URL: ${{ secrets.VITE_APP_BASE_URL }}
          VITE_APP_API_URL: ${{secrets.VITE_APP_API_URL}}
          VITE_APP_API_SOCKET_URL: ${{secrets.VITE_APP_API_SOCKET_URL}}
        run: |
          echo "${ENV_FILE_CONTENT}" > ./environments/.env.dev

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test
